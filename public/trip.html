<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1620">
<title>旅程 · 小蜗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1620; --ink-2:#08121A; --paper:#F6F4EE; --paper-2:#ECE8DE; --p-ink:#0B1620; --p-muted:#55606A;
  --snow:#fff; --snow-2:rgba(255,255,255,.74); --snow-3:rgba(255,255,255,.52); --rule:rgba(255,255,255,.16);
  --sun:#F2B544; --ok:#6FBF9F; --warn:#F2B544; --bad:#F07A86;
  --ease:cubic-bezier(.16,1,.3,1);
  /* motion system: strong ease-out for enter/exit, ease-in-out for on-screen moves, generated springs for things that settle */
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-in-out:cubic-bezier(.77,0,.175,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --spring:linear(0, 0.0272, 0.0918, 0.1804, 0.2822, 0.3889, 0.494, 0.5933, 0.6837, 0.7635, 0.832, 0.8892, 0.9356, 0.9721, 0.9996, 1.0195, 1.033, 1.0412, 1.0452, 1.046, 1.0444, 1.0413, 1.0371, 1.0323, 1.0274, 1.0226, 1.0181, 1.014, 1.0104, 1.0073, 1.0048, 1.0027, 1.0011, 0.9999, 0.999, 0.9984, 0.9981, 0.9979, 0.9979, 0.998, 0.9981, 0.9983, 0.9985, 0.9988, 0.999, 0.9992, 0.9994, 0.9995, 1); /* stiffness 300, damping 24 — 0.64s, ~4% overshoot */
  --spring-soft:linear(0, 0.0192, 0.0653, 0.1291, 0.1948, 0.2738, 0.3542, 0.433, 0.4999, 0.5703, 0.6348, 0.6929, 0.7391, 0.7852, 0.8251, 0.8559, 0.8856, 0.9106, 0.9314, 0.9468, 0.9611, 0.9726, 0.9817, 0.9881, 0.9937, 0.9979, 1.0007, 1.003, 1.0045, 1.0054, 1.0059, 1.0061, 1.006, 1.0058, 1.0054, 1.005, 1.0045, 1.0041, 1.0036, 1.0032, 1.0027, 1.0024, 1.002, 1.0017, 1.0014, 1.0011, 1.0009, 1.0007, 1); /* stiffness 170, damping 22 — 0.7s */
  --display:"Familjen Grotesk","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --body:"PingFang SC","Noto Sans SC","Microsoft YaHei","Familjen Grotesk",system-ui,sans-serif;
  --c1:#081826; --c2:#2D6A80; --acc:#9AD3E3;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--snow);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
::selection{background:var(--sun);color:var(--ink)}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px;border-radius:6px}
input,textarea{caret-color:var(--sun)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:1fr;height:100dvh}
#index{display:none}
#feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
#bill{display:none;height:100dvh;overflow-y:auto}
body[data-view=bill] #feed, body[data-view=bill] #rail{display:none}
body[data-view=bill] #bill{display:block}
#trans{display:none;height:100dvh;overflow-y:auto}
#syncpill{position:fixed;z-index:1001;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));translate:-50% 0;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;background:#101D28;color:var(--snow-2);border:1px solid var(--rule);box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:calc(100vw - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#syncpill.offline{color:var(--sun);border-color:rgba(242,181,68,.45)}
#syncpill.conflict{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.cf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cf>div{padding:12px;border-radius:12px;background:rgba(255,255,255,.06);display:grid;gap:4px}
.cf small{color:var(--snow-3);font-size:12px}
.cf p{margin:4px 0 0;font-size:13px;color:var(--snow-2)}
.bk h4{margin:18px 0 8px;font-size:13px;color:var(--snow-3);font-weight:600}
.bk .lab{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:rgba(242,181,68,.16);color:var(--sun);font-size:11px;font-weight:600}
body[data-view=trans] #feed, body[data-view=trans] #rail{display:none}
body[data-view=trans] #trans{display:block}
#plan{display:none}
body[data-view=plan] #feed, body[data-view=plan] #rail{display:none}
body[data-view=plan] #plan{display:grid}

.seg{display:inline-flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid var(--rule)}
.seg a{padding:6px 14px;border-radius:999px;color:var(--snow-2);text-decoration:none;font-size:13px;font-weight:600;transition:background .2s,color .2s}
.seg a[aria-current=page]{background:var(--snow);color:var(--ink)}
#topbar{position:fixed;z-index:1000;top:max(12px,env(safe-area-inset-top));right:12px}

@media (min-width:900px){
  .app{grid-template-columns:272px 1fr}
  #index{display:flex;flex-direction:column;background:var(--ink-2);border-right:1px solid var(--rule);height:100dvh;min-height:0}
  #topbar{display:none}
}
.ix-head{padding:28px 22px 18px}
.ix-head h1{font-family:var(--display);font-size:24px;line-height:1.1;margin:0 0 4px;letter-spacing:-.02em;font-weight:700}
.ix-head p{margin:0 0 16px;color:var(--snow-3);font-size:13px}
.ix-list{list-style:none;margin:0;padding:6px 10px;overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.ix-list button{display:grid;grid-template-columns:10px 34px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 12px;border-radius:10px;color:var(--snow-2);transition:background .2s,color .2s}
.ix-list button:hover{background:rgba(255,255,255,.05);color:var(--snow)}
.ix-list button[aria-current=true]{background:rgba(255,255,255,.09);color:var(--snow)}
.ix-list .sw{width:10px;height:28px;border-radius:3px;background:var(--acc)}
.ix-list .dn{font-family:var(--display);font-weight:700;font-size:13px}
.ix-list .ct{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ix-list .dt{font-size:12px;color:var(--snow-3)}
.ix-foot{display:flex;gap:6px;padding:14px 16px 20px;border-top:1px solid var(--rule)}
.ghost{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;border:1px solid var(--rule);color:var(--snow-2);font-size:13px;transition:background .2s,color .2s,border-color .2s}
.ghost:hover{background:rgba(255,255,255,.07);color:var(--snow);border-color:rgba(255,255,255,.3)}
.ghost svg.i{width:16px;height:16px}

/* ---------- screens ---------- */
.screen{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 120%);isolation:isolate}
.field{position:absolute;inset:0;z-index:-2;overflow:hidden}
.scrim{position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,transparent 55%,rgba(4,8,14,.4) 100%)}
.scrim.on-photo{background:linear-gradient(180deg,rgba(5,10,15,.45) 0%,rgba(5,10,15,.05) 20%,rgba(5,10,15,.25) 42%,rgba(5,10,15,.78) 62%,rgba(5,10,15,.92) 100%)}
@media (min-width:900px){.scrim.on-photo{background:linear-gradient(180deg,rgba(5,10,15,.4) 0%,rgba(5,10,15,0) 25%,rgba(5,10,15,.18) 55%,rgba(5,10,15,.85) 100%)}}

/* 天光与极光: each day's sky comes from its real daylight hours. */
.screen[data-sky]{background:linear-gradient(180deg,var(--s1) 0%,var(--s2) 34%,var(--s3) 52%,var(--s4) 68%,var(--s5) 100%)}
.screen[data-sky=day]{--s1:#1A2A5A;--s2:#4D63A4;--s3:#E3A08C;--s4:#2B2541;--s5:#0D1323;--glow:rgba(255,196,150,.55)}
.screen[data-sky=short]{--s1:#0D1432;--s2:#2B3977;--s3:#B97C9C;--s4:#1E1C3A;--s5:#090E1D;--glow:rgba(255,160,175,.38)}
.screen[data-sky=polar]{--s1:#02070F;--s2:#061829;--s3:#0C3537;--s4:#071820;--s5:#040A11}
.ph-bg{position:absolute;inset:0;background-size:cover;background-position:center}
/* the photo takes on the day's light: a soft-light pass of the same sky */
.tint{position:absolute;inset:0;background:linear-gradient(180deg,var(--s1) 0%,var(--s2) 34%,var(--s3) 52%,var(--s4) 68%,var(--s5) 100%);mix-blend-mode:soft-light;opacity:.9}
.screen[data-sky=day] .tint,.screen[data-sky=short] .tint{mix-blend-mode:overlay;opacity:.62}
.screen[data-sky=polar] .tint{mix-blend-mode:multiply;opacity:.32}
.glow{position:absolute;left:-25%;right:-25%;top:28%;height:46%;background:radial-gradient(ellipse 50% 50% at 50% 55%,var(--glow),transparent 70%);mix-blend-mode:screen;animation:glow 36s ease-in-out infinite alternate;pointer-events:none}
.screen[data-sky=polar] .glow{display:none}
@keyframes glow{from{transform:translateX(-7%) scaleY(.94)}to{transform:translateX(7%) scaleY(1.06)}}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
.fx.aurora{filter:blur(9px) saturate(1.15);opacity:0;transition:opacity 1.6s var(--ease)}
.fx.aurora.on{opacity:1}
.city,.caption,.d-top{text-shadow:0 1px 18px rgba(4,8,14,.35)}

/* cover */
.cover{display:flex;flex-direction:column;justify-content:space-between;padding:max(64px,calc(env(safe-area-inset-top) + 56px)) 20px max(28px,env(safe-area-inset-bottom))}
.cover h2{font-family:var(--display);font-weight:700;font-size:clamp(52px,12vw,112px);line-height:.95;letter-spacing:-.035em;margin:0;text-wrap:balance}
.cover .route{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:22px 0 0;font-family:var(--display);font-weight:600;font-size:clamp(18px,3vw,26px);letter-spacing:.04em}
.cover .route i{width:22px;height:1px;background:var(--snow-3);display:inline-block}
.cover .facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;color:var(--snow-2);font-size:14px}
.count{font-family:var(--display);font-size:clamp(20px,3vw,28px);font-weight:600;margin:0}
.count b{font-size:1.9em;font-weight:700;letter-spacing:-.03em;color:var(--sun)}
.strip{display:flex;gap:3px;margin:18px 0 10px;height:56px}
.strip button{flex:1;border-radius:4px;background:var(--acc);position:relative;transition:transform .35s var(--ease),filter .2s;min-width:0}
.strip button:hover{transform:translateY(-4px);filter:brightness(1.1)}
.strip button span{position:absolute;left:5px;bottom:4px;font-size:11px;font-weight:700;color:var(--ink);font-family:var(--display)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--snow-3)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}
.sample{display:inline-block;margin-top:14px;font-size:12px;color:var(--snow-3);border:1px dashed var(--rule);border-radius:8px;padding:6px 10px}
.cover-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.open-day svg.i{width:16px;height:16px}
@media (max-width:899px){.cover>div:first-child>:not(h2){margin-right:76px}.cover h2{font-size:clamp(40px,11vw,112px)}}
@media (max-width:599px){.strip button span{display:none}}
.hint{display:flex;align-items:center;gap:8px;color:var(--snow-3);font-size:13px;margin-top:20px}
.hint svg{animation:bob 2.4s var(--ease) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

/* day */
.day{display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.d-top{display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--snow-2);padding-right:120px}
.d-top b{font-family:var(--display);color:var(--snow);font-size:15px}
.d-hero{margin-top:auto;padding-right:64px}
.city{font-family:var(--display);font-weight:700;font-size:clamp(48px,min(13vw,7.4vw + 24px),112px);line-height:.95;letter-spacing:-.035em;margin:0;text-wrap:balance;transition:transform .9s var(--ease),opacity .9s var(--ease)}
.city button{all:unset;cursor:pointer}
.caption{margin:10px 0 0;color:var(--snow-2);font-size:15px;max-width:52ch}
.daylight{margin-top:16px;max-width:460px}
.dl-track{position:relative;height:10px;border-radius:999px;background:rgba(0,0,0,.32);overflow:hidden}
.dl-track i{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.18)}
.dl-fill{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--sun);transform-origin:left;transition:transform 1.1s var(--ease) .15s}
.dl-meta{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--snow-3)}
.dl-meta b{color:var(--snow);font-weight:600}
.screen.idle .city{transform:translateY(18px);opacity:.55}
.screen.idle .dl-fill{transform:scaleX(0)}
.screen.idle .stops li{opacity:.4;transform:translateY(5px)}

.d-panel{margin-top:18px}
.tickets{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.tickets::-webkit-scrollbar{display:none}
.tickets>.tk{scroll-snap-align:center;flex:0 0 calc(100% - 4px)}
.tickets:has(.tk:only-child)>.tk{flex-basis:100%}
.open-day{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:10px;padding:13px 16px;border-radius:12px;background:rgba(0,0,0,.3);color:var(--snow);font-size:14px;font-weight:600;transition:background .2s}
.open-day:hover{background:rgba(0,0,0,.42)}
.open-day span{color:var(--snow-3);font-weight:400}
.d-panel .stops-wrap,.d-panel .journal,.d-panel .meals-wrap{display:none}
.add-tk{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:18px;border:1.5px dashed rgba(255,255,255,.3);border-radius:14px;color:var(--snow-2);font-size:14px;transition:border-color .2s,color .2s}
.add-tk:hover{border-color:var(--snow);color:var(--snow)}

@media (min-width:900px){
  .day{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,440px);grid-template-rows:auto 1fr;padding:0}
  .d-top{grid-column:1;padding:32px 40px 0}
  .d-hero{grid-column:1;grid-row:2;align-self:end;padding:0 96px 48px 40px}
  .day .city{font-size:clamp(48px,5.6vw,104px)}
  .d-panel{grid-column:2;grid-row:1/3;margin:0;background:color-mix(in oklab,var(--c1) 72%,black);border-left:1px solid var(--rule);padding:28px 24px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--rule) transparent;display:flex;flex-direction:column;gap:22px}
  .tickets{flex-direction:column;overflow:visible;margin:0;padding:0}
  .tickets>.tk{flex:none}
  .open-day{display:none}
  .d-panel .stops-wrap,.d-panel .journal,.d-panel .meals-wrap{display:block}
  .cover{padding:56px 64px 48px}
}
.p-h{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
.p-h h3{margin:0;font-size:13px;font-weight:600;color:var(--snow-3);letter-spacing:.02em}
.p-h button{display:inline-flex;align-items:center;gap:4px;color:var(--snow-2);font-size:13px;padding:4px 8px;border-radius:8px}
.p-h button:hover{background:rgba(255,255,255,.08);color:var(--snow)}
.p-h svg.i{width:16px;height:16px}

/* stops */
.stops{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.stops li{border-radius:12px;background:rgba(255,255,255,.06);transition:opacity .5s var(--ease),transform .5s var(--ease),background .3s;touch-action:pan-y}
.stops li:nth-child(2){transition-delay:80ms}.stops li:nth-child(3){transition-delay:160ms}.stops li:nth-child(4){transition-delay:240ms}.stops li:nth-child(n+5){transition-delay:300ms}
.stops li.dragging{z-index:5;position:relative;background:rgba(255,255,255,.16);box-shadow:0 12px 28px rgba(0,0,0,.35);transition:background .2s,box-shadow .2s;transition-delay:0s}
.stops li.shifting{transition:transform .22s var(--ease);transition-delay:0s}
.stops .row{display:grid;grid-template-columns:28px 46px 1fr auto 28px;align-items:center;gap:6px;padding:9px 8px 9px 2px}
.stops .st{display:flex;align-items:center;gap:6px}
.stops .st>span{min-width:0;flex:1}
.stops .st .chev{width:16px;height:16px;color:var(--snow-3);transition:transform .3s var(--ease)}
.stops li.open .st .chev{transform:rotate(90deg)}
.stops .st .pc{font-size:11px;color:var(--snow-3);white-space:nowrap}
.sd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--ease)}
.stops li.open .sd{grid-template-rows:1fr}
.sd-in{overflow:hidden;min-height:0}
.sd-pad{padding:2px 12px 14px;opacity:0;transform:translateY(-4px);transition:opacity .3s,transform .38s var(--ease)}
.stops li.open .sd-pad{opacity:1;transform:none}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.ph{position:relative;flex:0 0 78%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.06);scroll-snap-align:start}
.ph:only-of-type{flex-basis:100%}
.ph .view{display:block;width:100%;height:100%;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:6px;right:6px;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(5,10,15,.6);color:#fff}
.ph .rm svg.i{width:14px;height:14px}
.ph.missing::after{content:"图片已不在本设备";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--snow-3)}
.add-ph{flex:0 0 108px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed rgba(255,255,255,.25);border-radius:10px;color:var(--snow-2);font-size:12px;min-height:84px}
.add-ph:hover{border-color:var(--snow);color:var(--snow)}
.intro{margin:12px 0 0;font-size:14px;line-height:1.75;color:var(--snow-2);max-width:62ch}
.rec{display:grid;gap:6px;margin-top:12px;font-size:12px;color:var(--snow-3)}
.rec textarea{width:100%;min-height:76px;resize:vertical;padding:10px 12px;border-radius:10px;border:1px solid var(--rule);background:rgba(0,0,0,.18);color:var(--snow);font-size:14px;line-height:1.65;transition:border-color .2s}
.rec textarea:focus{outline:0;border-color:var(--sun)}
.sd-acts{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--snow-3)}
.sd-acts button{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:8px;border:1px solid var(--rule);color:var(--snow-2);font-size:13px}
.sd-acts button:hover{background:rgba(255,255,255,.08);color:var(--snow)}
.sd-acts svg.i{width:14px;height:14px}
.sd-acts{flex-wrap:wrap}
.src{margin:6px 0 0;font-size:12px;color:var(--snow-3)}
.src a{color:var(--snow-2);text-underline-offset:3px}

/* ---------- plan view ---------- */
@media (min-width:900px){ body[data-view=plan] .app{grid-template-columns:1fr} body[data-view=plan] #index{display:none} }
#plan{height:100dvh;grid-template-columns:minmax(0,1fr);grid-template-rows:44dvh minmax(0,1fr);background:var(--ink-2)}
#map{order:-1;position:relative;z-index:0;isolation:isolate;background:#0E1A23;min-height:0}
.pl-side{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--rule)}
@media (min-width:900px){ #plan{grid-template-rows:none;grid-template-columns:400px minmax(0,1fr)} #map{order:0} .pl-side{border-top:0;border-right:1px solid var(--rule)} }
.pl-head{padding:14px 16px 10px;display:grid;gap:10px}
.pl-head .top{display:none;justify-content:space-between;align-items:center}
@media (min-width:900px){ .pl-head{padding:22px 20px 12px} .pl-head .top{display:flex} }
.pl-head h2{margin:0;font-family:var(--display);font-size:24px;letter-spacing:-.02em}
.srch{display:flex;gap:8px}
.srch input{flex:1;min-width:0;padding:11px 12px 11px 38px;border-radius:12px;border:1px solid var(--rule);background:rgba(255,255,255,.06) no-repeat 12px 50%/18px;color:var(--snow);font-size:15px}
.srch input:focus{outline:0;border-color:var(--sun)}
.srch .ico{position:absolute;margin:12px 0 0 12px;color:var(--snow-3);pointer-events:none}
.srch .ico svg.i{width:18px;height:18px}
.srch label{position:relative;flex:1;display:flex}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--rule);font-size:13px;color:var(--snow-2);white-space:nowrap}
.chips button i{width:8px;height:8px;border-radius:2px;background:var(--acc)}
.chips button[aria-pressed=true]{background:var(--snow);color:var(--ink);border-color:var(--snow)}
.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--rule)}
.tabs button{padding:10px 10px;font-size:14px;color:var(--snow-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--snow);border-color:var(--sun);font-weight:600}
.pl-body{flex:1;overflow-y:auto;padding:14px 16px 28px;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.pl-day{margin:0 0 18px}
.pl-day h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;font-size:13px;color:var(--snow-2);font-weight:600}
.pl-day h3 b{font-family:var(--display);color:var(--snow)}
.pl-day h3 button{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--snow-3);padding:4px 8px;border-radius:8px}
.pl-day h3 button:hover{background:rgba(255,255,255,.08);color:var(--snow)}
.pl-day h3 svg.i{width:14px;height:14px}
.res{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.res li{padding:12px;border-radius:12px;background:rgba(255,255,255,.06);display:grid;gap:4px}
.res li.hot{background:rgba(242,181,68,.14)}
.res b{font-size:15px}
.res small{color:var(--snow-3);font-size:12px;line-height:1.5}
.res .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.res .acts button,.res .acts select{padding:6px 10px;border-radius:8px;border:1px solid var(--rule);font-size:13px;color:var(--snow-2);background:none}
.res .acts button.pri{background:var(--sun);border-color:var(--sun);color:var(--ink);font-weight:600}
.res .acts select option{background:#101D28}
.res .acts a{padding:6px 10px;border-radius:8px;border:1px solid var(--rule);font-size:13px;color:var(--snow-2);text-decoration:none}
.res .acts a:hover{background:rgba(255,255,255,.07);color:var(--snow)}
.hf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.hf label{display:grid;gap:5px;font-size:12px;color:var(--snow-2)}
.hf select,.hf input{padding:9px 10px;border-radius:10px;border:1px solid var(--rule);background:rgba(255,255,255,.05);color:var(--snow);font-size:14px;min-width:0}
.hf select option{background:#101D28}
.anc{display:grid;gap:4px;max-height:240px;overflow-y:auto;padding:8px 10px;border:1px solid var(--rule);border-radius:12px}
.anc label{display:flex;align-items:center;gap:10px;font-size:14px;padding:3px 0;cursor:pointer}
.anc .chk{width:18px;height:18px;border-radius:5px}
.anc-d{margin:6px 0 2px;font-size:11px;color:var(--snow-3)}
.anc-d:first-child{margin-top:0}
.pg{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px;border-radius:12px;background:rgba(255,255,255,.06)}
.pg img,.pg .noimg{width:96px;height:96px;border-radius:8px;object-fit:cover;background:rgba(255,255,255,.06)}
.pg .noimg{display:grid;place-items:center;color:var(--sun)}
.pg h4{margin:0;font-size:15px}
.pg .k{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(242,181,68,.18);color:var(--sun);margin-right:6px}
.pg p{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--snow-2)}
.pg .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.pg .acts button,.pg .acts select{padding:6px 10px;border-radius:8px;border:1px solid var(--rule);font-size:13px;color:var(--snow-2);background:none}
.pg .acts button.pri{background:var(--sun);border-color:var(--sun);color:var(--ink);font-weight:600}
.pg-list{display:grid;gap:10px}
.pg .k.b{background:rgba(255,255,255,.08);color:var(--snow-2)}
.pg-city{margin:16px 0 8px;font-size:13px;color:var(--snow-3);font-weight:600}
.pg-city:first-child{margin-top:0}
.hintline{margin:0 0 12px;font-size:12px;color:var(--snow-3);line-height:1.6}
.map-msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--snow-2);font-size:14px;z-index:500}
/* leaflet theming */
#map.filtered .leaflet-tile-pane{filter:invert(1) hue-rotate(185deg) brightness(.92) contrast(.88) saturate(.55)}
.leaflet-container{font:inherit;background:#0E1A23}
.leaflet-control-zoom a,.leaflet-bar a{background:#101D28;color:var(--snow);border-color:var(--rule)}
.leaflet-control-zoom a:hover{background:#18293A}
.leaflet-control-attribution{background:rgba(8,18,26,.7)!important;color:var(--snow-3)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--snow-2)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#101D28;color:var(--snow);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.leaflet-popup-content-wrapper{border-radius:14px}
.leaflet-popup-content{margin:12px;width:240px!important;font-size:13px;line-height:1.55}
.leaflet-container a.leaflet-popup-close-button{color:var(--snow-3)}
.pop img{width:100%;height:120px;object-fit:cover;border-radius:8px;display:block;margin-bottom:8px}
.pop b{display:block;font-size:15px}
.pop small{display:block;color:var(--snow-3);font-size:12px}
.pop p{margin:6px 0 0;color:var(--snow-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pop .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pop .acts button,.pop .acts a{padding:5px 9px;border-radius:8px;border:1px solid var(--rule);color:var(--snow-2);font-size:12px;text-decoration:none}
.pop .acts button.pri{background:var(--sun);border-color:var(--sun);color:var(--ink);font-weight:600}
.pin{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--c);color:var(--ink);font:700 12px/1 var(--display);border:2px solid #0B1620;box-shadow:0 2px 6px rgba(0,0,0,.45);transition:transform .2s var(--ease),opacity .2s}
.pin.dim{opacity:.4;transform:scale(.72)}
.pin.pgp{border-radius:7px;transform:rotate(45deg);background:var(--sun);width:22px;height:22px}
.pin.pgp svg{transform:rotate(-45deg);width:13px;height:13px;fill:var(--ink);stroke:none}
.pin.sr{background:var(--snow)}
.pin.ht{border-radius:7px;background:#F2B544}
.pin.anc{box-shadow:0 0 0 3px #fff,0 2px 6px rgba(0,0,0,.45)}
.pin.hl{transform:scale(1.25);box-shadow:0 0 0 4px rgba(242,181,68,.45),0 2px 6px rgba(0,0,0,.45)}
.basemap{position:absolute;right:10px;top:10px;z-index:600}
@media (max-width:899px){ .basemap{top:auto;bottom:24px} }
.basemap button{padding:6px 10px;border-radius:10px;background:#101D28;border:1px solid var(--rule);color:var(--snow-2);font-size:12px}
#lb{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(3,7,10,.92);opacity:0;pointer-events:none;transition:opacity .25s;padding:16px}
#lb.open{opacity:1;pointer-events:auto}
#lb img{max-width:100%;max-height:88dvh;border-radius:8px;transform:scale(.97);transition:transform .35s var(--ease)}
#lb.open img{transform:none}
#lb p{position:absolute;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));text-align:center;color:var(--snow-2);font-size:13px;margin:0}
.dr-foot .saved{align-self:center;font-size:12px;color:var(--snow-3)}
.stops li.flash{animation:flash 1.15s ease-out both}
@keyframes flash{0%,30%{background:color-mix(in oklab,var(--sun) 40%,transparent)}to{background:rgba(255,255,255,.06)}}
.grip{display:grid;place-items:center;height:36px;color:var(--snow-3);cursor:grab;touch-action:none;border-radius:8px}
.grip:hover{color:var(--snow)}
.grip svg.i{width:18px;height:18px}
.stops time{font-size:13px;color:var(--snow-2)}
.stops .st{text-align:left;min-width:0}
.stops .st b{display:block;font-weight:600;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.stops .st small{display:block;color:var(--snow-3);font-size:12px}
.stops .amt{font-size:13px;color:var(--snow-2);white-space:nowrap}
.stops li.done .st b{text-decoration:line-through;text-decoration-color:var(--snow-3);color:var(--snow-3)}
.chk{appearance:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--snow-3);margin:0;cursor:pointer;display:grid;place-items:center;transition:background .2s,border-color .2s}
.chk:checked{background:var(--sun);border-color:var(--sun)}
.chk:checked::after{content:"";width:9px;height:5px;border:2px solid var(--ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.meals{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.meals li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:start;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06)}
.meals .mt{font-size:11px;padding:3px 7px;border-radius:999px;background:rgba(242,181,68,.16);color:var(--sun);white-space:nowrap;margin-top:2px}
.meals .mn{text-align:left;min-width:0}
.meals .mn b{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.meals .mn small{display:block;font-size:12px;color:var(--snow-3)}
.meals .mn small.nt{color:var(--snow-2);margin-top:2px}
.meals .mr{display:grid;justify-items:end;gap:2px;font-size:12px;color:var(--snow-2)}
.meals .mr i{font-style:normal;font-size:11px;padding:2px 7px;border-radius:999px}
.meals .r-1{background:rgba(111,191,159,.2);color:#9FE0C2}.meals .r-2{background:rgba(255,255,255,.1)}.meals .r-3{background:rgba(240,122,134,.18);color:#FFB8C1}
.mph{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.mph .ph{flex:0 0 76px;aspect-ratio:1}
.mph .ph .rm{width:22px;height:22px;top:3px;right:3px}
.mph .add-ph{flex:0 0 44px;min-height:44px;aspect-ratio:1;border-radius:8px}
.mph:not(:has(.ph)) .add-ph{flex-basis:36px;min-height:32px;aspect-ratio:auto;border-style:dotted;opacity:.7}
.empty{color:var(--snow-3);font-size:13px;padding:14px;border:1px dashed var(--rule);border-radius:12px;text-align:center}
.journal p{margin:0;white-space:pre-wrap;color:var(--snow-2);font-size:14px;line-height:1.7}
.journal .write{width:100%;text-align:left;padding:14px;border-radius:12px;background:rgba(255,255,255,.06);color:var(--snow-3);font-size:14px}
.journal .write:hover{background:rgba(255,255,255,.1);color:var(--snow-2)}

/* ---------- ticket styles ---------- */
.tk{--stub:104px;--cut:calc(100% - var(--stub));display:grid;grid-template-columns:minmax(0,1fr) var(--stub);background:var(--paper);color:var(--p-ink);border-radius:14px;text-align:left;width:100%;
  -webkit-mask:radial-gradient(circle 9px at var(--cut) 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at var(--cut) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 9px at var(--cut) 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at var(--cut) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  transition:transform .3s var(--ease)}
.tk:hover{transform:translateY(-2px)}
.tk-main{padding:14px 16px 14px;min-width:0}
.tk-stub{min-width:0;border-left:2px dashed #C9C3B5;padding:14px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;background:var(--paper-2)}
.tk-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--p-muted)}
.tk-kind{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--p-ink)}
.tk-kind svg.i{width:16px;height:16px}
.tk-route{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;margin:8px 0 10px}
.tk-route .r{text-align:right}
.tk-code{display:block;font-family:var(--display);font-weight:700;font-size:38px;line-height:1;letter-spacing:-.02em}
.tk-stn{display:block;font-family:var(--display);font-weight:700;font-size:21px;line-height:1.15}
.tk-route small{display:block;font-size:12px;color:var(--p-muted);margin-top:3px}
.tk-route .mid{display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:6px;color:var(--p-muted);font-size:11px;white-space:nowrap}
.tk-route .mid svg.i{width:20px;height:20px;color:var(--p-ink)}
.tk-route .mid hr{width:56px;border:0;border-top:1.5px dotted var(--p-muted);margin:0}
.tk-grid{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:4px 10px;margin:0}
.tk-grid div{min-width:0}
.tk-grid dt,.tk-stub dt{font-size:11px;color:var(--p-muted);letter-spacing:.04em}
.tk-grid dd,.tk-stub dd{margin:0;font-family:var(--display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.tk-stub dd.big{font-size:26px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.tk-status{font-size:11px;font-weight:600;padding:3px 7px;border-radius:999px;background:var(--p-ink);color:var(--paper);align-self:flex-start}
.tk-status.todo{background:#C2273A}
.tk-status.spot{background:#2E6B57}
.tk-band{height:6px;background:var(--acc);margin:-14px -16px 12px;border-radius:14px 0 0 0}
.tk-legs{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;margin:10px 0 12px}
.tk-legs time{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.tk-legs b{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2;overflow-wrap:anywhere}
.tk-legs .dur{grid-column:2;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--p-muted);padding:2px 0}
.tk-legs .dur svg.i{width:14px;height:14px}
.tk-train .tk-row b{font-family:var(--display);font-size:14px;color:var(--p-ink)}
.tk-train time{display:block;font-family:var(--display);font-size:13px;font-weight:600;color:var(--p-muted)}
.barcode{display:block;width:100%;height:30px}
.holes{display:flex;gap:5px;flex-wrap:wrap}
.holes i{width:9px;height:9px;border-radius:50%;border:1.5px solid #B9B2A3}
.holes i.p{background:var(--ink);border-color:var(--ink)}
@media (min-width:900px){.tk-code{font-size:40px}}

/* ---------- floating rail (draggable, collapsible) ---------- */
#rail{position:fixed;z-index:40;left:0;top:0;display:flex;flex-direction:column;align-items:center;touch-action:none;transition:opacity .2s}
#rail:not(.wm-ready){opacity:0}
.pill{display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:40px;background:rgba(6,12,18,.62);border:1px solid var(--rule);box-shadow:0 2px 6px rgba(0,0,0,.22);transition:box-shadow .2s,border-color .2s,padding .25s var(--ease),gap .25s var(--ease)}
#rail.dragging .pill{box-shadow:0 6px 14px rgba(0,0,0,.3);border-color:rgba(255,255,255,.35)}
#rail.dragging,#rail.dragging *{cursor:grabbing!important;user-select:none}
.handle{display:grid;place-items:center;width:44px;height:20px;border-bottom:1px solid var(--rule);color:var(--snow-3);cursor:grab;touch-action:none}
.handle svg.i{width:18px;height:18px}
.ra{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--snow);transition:background .2s,transform .2s var(--ease)}
.ra:hover,.ra:focus-visible{background:rgba(255,255,255,.14);transform:scale(1.08)}
.ra-l{font-size:11px;color:var(--snow-2);text-align:center;margin-top:-4px;line-height:1}
.ra-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
@media (min-width:900px){ .ra-ai{display:none} }
#rail.collapsed .pill{padding:4px;gap:0}
#rail.collapsed .pill>:not(.handle){display:none}
#rail.collapsed .handle{width:42px;height:42px;border-bottom:0;border-radius:50%}

/* ---------- drawer ---------- */
.drawer{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;background:rgba(4,9,14,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .22s}
.drawer.open{opacity:1;pointer-events:auto}
/* In 规划 the editor docks beside the map without dimming it, so autosaved edits show live. */
body[data-view=plan] .drawer,body[data-view=plan] .drawer.open{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none}
body[data-view=plan] .drawer.open aside{pointer-events:auto}
@media (max-width:899px){ body[data-view=plan] .drawer aside{max-height:58dvh} }
.drawer aside{width:100%;max-height:min(86dvh,760px);display:flex;flex-direction:column;background:#101D28;color:var(--snow);border-radius:20px 20px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.4);transform:translateY(100%);transition:transform .2s var(--ease-out);outline:0}
.drawer.open aside{transition:transform .5s var(--ease-drawer)}
.drawer.open aside{transform:none}
@media (min-width:900px){
  .drawer,.drawer.open{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none;opacity:1}
  .drawer aside{position:fixed;left:0;top:0;width:min(420px,92vw);height:auto;max-height:calc(100dvh - 32px);border-radius:16px;border:1px solid var(--rule);box-shadow:0 24px 60px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.25);transform:none;opacity:0;scale:.96;filter:blur(4px);pointer-events:none;transition:opacity .16s var(--ease-out),scale .16s var(--ease-out),filter .16s var(--ease-out)}
  .drawer.open aside{opacity:1;scale:1;filter:none;pointer-events:auto;transition:opacity .26s var(--ease-out),scale .6s var(--spring),filter .3s var(--ease-out)}
  .dr-head{cursor:grab;touch-action:none;border-radius:16px 16px 0 0}
  .dr-head h3{pointer-events:none}
}
/* mobile sheet follows the finger while dragged down */
.drawer aside.sheet-drag{transition:none!important}
.dr-head{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--rule)}
.dr-head::before{content:"";position:absolute;left:50%;top:7px;width:36px;height:4px;border-radius:9px;background:var(--rule);transform:translateX(-50%)}
@media (min-width:900px){.dr-head::before{display:none}}
.dr-head h3{margin:0;font-family:var(--display);font-size:20px;letter-spacing:-.01em}
.x{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:var(--snow-2)}
.x:hover{background:rgba(255,255,255,.1);color:var(--snow)}
.dr-body{padding:16px 18px;overflow-y:auto;flex:1}
.dr-foot{display:flex;gap:10px;justify-content:space-between;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--rule)}
.dr-foot .r{display:flex;gap:10px;margin-left:auto}
.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f label{display:grid;gap:5px;font-size:12px;color:var(--snow-2);min-width:0}
.f label.w{grid-column:1/-1}
.f input,.f select,.f textarea{width:100%;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--rule);background:rgba(255,255,255,.05);color:var(--snow);font-size:15px;transition:border-color .2s,background .2s}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--sun);background:rgba(255,255,255,.08)}
.f select option{background:#101D28}
.f textarea{min-height:96px;resize:vertical;line-height:1.6}
.f textarea.big{min-height:300px}
.f input:invalid:not(:placeholder-shown){border-color:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--sun);color:var(--ink)}
.btn.pri:hover{background:#F6C565}
.btn.sec{border:1px solid var(--rule);color:var(--snow-2)}
.btn.sec:hover{background:rgba(255,255,255,.07)}
.btn.dan{color:var(--bad)}
.btn.dan:hover{background:rgba(240,122,134,.12)}
.err{color:var(--bad);font-size:13px;margin:10px 0 0}
.pack{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:4px}
.pack li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-radius:10px}
.pack li:hover{background:rgba(255,255,255,.05)}
.pack li.done span{color:var(--snow-3);text-decoration:line-through}
.pack .del{color:var(--snow-3);padding:4px;border-radius:6px}
.pack .del:hover{color:var(--bad)}
.pack .del svg.i{width:16px;height:16px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--rule);background:rgba(255,255,255,.05);color:var(--snow)}
.prog{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin:4px 0 14px}
.prog i{display:block;height:100%;background:var(--ok);transition:width .5s var(--ease)}
/* ---------- assistant: a paper notebook floating over the trip ---------- */
.ai{--pp:#F7F5F0;--pp2:#EFEBE2;--pi:#15212C;--pm:#5D6772;--pl:rgba(21,33,44,.11);--pa:#B8243A}
/* capsule: same night-glass material as the button rail, lit by a slowly turning aurora ring */
.ai-cap{position:fixed;z-index:70;left:0;top:0;display:inline-flex;align-items:center;gap:9px;padding:6px 15px 6px 6px;border-radius:999px;background:rgba(6,12,18,.66);border:1px solid rgba(255,255,255,.14);color:var(--snow);font-weight:600;font-size:13.5px;letter-spacing:.01em;box-shadow:0 6px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);cursor:grab;touch-action:none;transition:opacity .2s var(--ease-out),transform .16s var(--ease-out),border-color .25s,box-shadow .3s}
@media (hover:hover){ .ai-cap:hover{border-color:rgba(124,255,196,.35);box-shadow:0 8px 26px rgba(0,0,0,.4),0 0 22px rgba(92,255,176,.12),inset 0 1px 0 rgba(255,255,255,.08)} }
.ai-cap:not(.wm-ready){opacity:0}
.ai-cap:active{transform:scale(.96)}
.ai-cap .orb{position:relative;isolation:isolate;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 50% 120%,rgba(92,255,176,.28),transparent 65%),#081521;color:#C9FFE6}
.ai-cap .orb::before{content:"";position:absolute;inset:-1px;z-index:-1;border-radius:50%;background:conic-gradient(from 0deg,#5CFFB0,#38E2CE,#8DB0EE,#A080FF,#5CFFB0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));animation:spin 7s linear infinite}
.ai-cap .orb svg.i{width:15px;height:15px;filter:drop-shadow(0 0 6px rgba(92,255,176,.55))}
.ai.busy .ai-cap .orb::before{animation-duration:1.6s}
.ai-cap.dragging{cursor:grabbing;border-color:rgba(255,255,255,.3);box-shadow:0 14px 34px rgba(0,0,0,.5)}
.ai.open .ai-cap{opacity:0;pointer-events:none}
@media (max-width:899px){ .ai-cap .cap-t{display:none} .ai-cap{padding:6px} body[data-view=trip] .ai-cap{display:none} }
.ai-panel{position:fixed;z-index:75;display:flex;flex-direction:column;background:var(--pp);color:var(--pi);overflow:hidden;
  left:0;right:0;bottom:0;height:min(84dvh,760px);border-radius:22px 22px 0 0;box-shadow:0 -18px 50px rgba(0,0,0,.45);
  opacity:0;pointer-events:none;transform:translateY(24px);transition:opacity .16s var(--ease-out),transform .2s var(--ease-out)}
.ai.open .ai-panel{opacity:1;pointer-events:auto;transform:none;transition:opacity .22s var(--ease-out),transform .6s var(--spring)}
.ai-panel.vt{transition:none!important}
@media (min-width:900px){
  .ai-panel{top:0;right:auto;bottom:auto;width:420px;height:min(680px,calc(100dvh - 48px));border-radius:20px;box-shadow:0 28px 70px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.25);transform:none;scale:.96;filter:blur(4px);transition:opacity .16s var(--ease-out),scale .16s var(--ease-out),filter .16s var(--ease-out)}
  .ai.open .ai-panel{scale:1;filter:none;transition:opacity .24s var(--ease-out),scale .6s var(--spring),filter .3s var(--ease-out)}
  .ai-head{cursor:grab}
}
body.ai-docked .ai-panel{left:auto!important;top:0!important;right:0;bottom:0;translate:none!important;height:100dvh;width:420px;border-radius:0;scale:1;filter:none;box-shadow:-1px 0 0 var(--pl)}
@media (min-width:900px){ body.ai-docked .app{margin-right:420px} body.ai-docked #topbar{right:432px} }
html.vt-ai::view-transition-old(root),html.vt-ai::view-transition-new(root){animation:none}
::view-transition-group(aibox){animation-duration:.55s;animation-timing-function:var(--spring)}
::view-transition-old(aibox),::view-transition-new(aibox){height:100%;object-fit:cover;object-position:top left}
.ai-head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;padding:10px 10px 10px 10px;border-bottom:1px solid var(--pl);touch-action:none;position:relative}
@media (max-width:899px){ .ai-head::before{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;border-radius:4px;background:var(--pl);translate:-50% 0} .ai-head{padding-top:16px} }
.ai-title{display:grid;justify-items:start;line-height:1.15;min-width:0}
.ai-title b{font-family:var(--display);font-size:16px;letter-spacing:-.01em}
.ai-model{font-size:12px;color:var(--pm);padding:2px 0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.ai-model:hover{color:var(--pi);text-decoration:underline;text-underline-offset:3px}
.ai-tools{display:flex;gap:2px}
.ai-ico{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:var(--pm);transition:background .15s,color .15s,transform .16s var(--ease-out)}
.ai-ico:hover{background:var(--pp2);color:var(--pi)}
.ai-ico[aria-expanded=true]{background:var(--pp2);color:var(--pi)}
.ai-ico svg.i{width:18px;height:18px}
.ai-dockbtn{display:none}
@media (min-width:900px){ .ai-dockbtn{display:grid} }
.ai-main{position:relative;flex:1;min-height:0;display:flex}
.ai-body{flex:1;overflow-y:auto;padding:18px 18px 10px;scrollbar-width:thin;scrollbar-color:var(--pl) transparent;scroll-behavior:smooth}
.ai-threads{position:absolute;z-index:2;inset:0 auto 0 0;width:min(280px,82%);background:var(--pp2);border-right:1px solid var(--pl);padding:10px;overflow-y:auto;translate:-104% 0;transition:translate .2s var(--ease-out),box-shadow .2s}
.ai-threads.open{translate:0 0;box-shadow:18px 0 40px rgba(21,33,44,.12);transition:translate .5s var(--spring),box-shadow .3s}
.ai-threads h4{margin:4px 6px 8px;font-size:12px;color:var(--pm);font-weight:600}
.th{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px;border-radius:10px;transition:background .15s}
.th:hover,.th.on{background:rgba(21,33,44,.06)}
.th>button:first-child{display:grid;gap:1px;text-align:left;padding:8px 10px;min-width:0}
.th b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th small{font-size:11px;color:var(--pm)}
.th .del{opacity:0;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;color:var(--pm);margin-right:4px}
.th:hover .del,.th:focus-within .del{opacity:1}
.th .del:hover{color:var(--pa);background:rgba(184,36,58,.08)}
.th .del svg.i{width:15px;height:15px}
.ai-log{display:grid;gap:16px}
@keyframes msg-in{from{opacity:0;transform:translateY(8px);filter:blur(4px)}}
.ai-log>.new{animation:msg-in .38s var(--ease-out) both}
.mu{justify-self:end;max-width:86%;padding:9px 14px;border-radius:18px 18px 6px 18px;background:var(--pi);color:var(--pp);font-size:14.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.ma{display:grid;gap:10px;font-size:14.5px;line-height:1.75;color:var(--pi)}
.prose{overflow-wrap:anywhere}
.prose>*{margin:0}
.prose>*+*{margin-top:.6em}
.prose h4{font-size:15px;font-weight:700;margin-top:.9em}
.prose ul,.prose ol{padding-left:1.25em}
.prose li+li{margin-top:.25em}
.prose li::marker{color:var(--pm)}
.prose a{color:var(--pa);text-decoration:underline;text-decoration-color:rgba(184,36,58,.35);text-underline-offset:3px}
.prose code{font-size:.9em;padding:1px 5px;border-radius:5px;background:var(--pp2)}
.prose pre{padding:10px 12px;border-radius:10px;background:var(--pp2);overflow-x:auto;font-size:13px}
.prose table{border-collapse:collapse;font-size:13px;width:100%}
.prose th,.prose td{border-bottom:1px solid var(--pl);padding:5px 6px;text-align:left;vertical-align:top}
.prose strong{font-weight:700}
.caret{display:inline-block;width:7px;height:1.05em;margin-left:2px;vertical-align:-2px;border-radius:2px;background:var(--pa);animation:caret 1s steps(2) infinite}
@keyframes caret{50%{opacity:0}}
.steps{border:1px solid var(--pl);border-radius:12px;background:rgba(255,255,255,.55);font-size:13px;color:var(--pm);overflow:hidden}
.steps>button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;text-align:left;color:var(--pi);font-weight:500}
.steps>button .chev{width:14px;height:14px;margin-left:auto;color:var(--pm);transition:rotate .3s var(--ease-out)}
.steps.open>button .chev{rotate:90deg}
.steps .st-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease-out)}
.steps.open .st-wrap{grid-template-rows:1fr}
.steps ol{list-style:none;margin:0;padding:0 12px 0;overflow:hidden;min-height:0}
.steps.open ol{padding-bottom:8px}
.steps li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;line-height:1.5}
.dot{flex:none;width:14px;height:14px;margin-top:3px;border-radius:50%;border:1.6px solid var(--pm);position:relative}
.dot.ok{border-color:#3F7D5A;background:#3F7D5A}
.dot.ok::after{content:"";position:absolute;left:4px;top:1.5px;width:3px;height:6px;border:solid #fff;border-width:0 1.5px 1.5px 0;rotate:45deg}
.dot.err{border-color:var(--pa);background:var(--pa)}
.dot.run{border-color:rgba(21,33,44,.2);border-top-color:var(--pi);animation:spin .7s linear infinite}
@keyframes spin{to{rotate:360deg}}
.chg2{border-radius:12px;padding:10px 12px;background:#EAF3EC;color:#24432F;font-size:13px}
.chg2 b{font-weight:600}
.chg2 ul{margin:6px 0 8px;padding-left:1.1em;display:grid;gap:2px}
.chg2 button{padding:5px 10px;border-radius:8px;border:1px solid rgba(36,67,47,.2);font-size:12px;font-weight:600;color:#24432F;background:#fff;transition:transform .16s var(--ease-out)}
.chg2 button:active{transform:scale(.96)}
.chg2 button:disabled{opacity:.5}
.macts{display:flex;gap:2px;margin-left:-6px}
.macts button{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;color:var(--pm);transition:background .15s,color .15s,transform .16s var(--ease-out)}
.macts button:hover{background:var(--pp2);color:var(--pi)}
.macts button:active{transform:scale(.94)}
.macts svg.i{width:15px;height:15px}
.merr{padding:9px 12px;border-radius:12px;background:#FBE9EC;color:#7A1426;font-size:13px;line-height:1.6}
.msys{justify-self:center;font-size:12px;color:var(--pm)}
.hello{padding:14px 2px 4px}
.hello h3{margin:0;font-family:var(--display);font-size:24px;line-height:1.2;letter-spacing:-.02em}
.hello p{margin:6px 0 16px;color:var(--pm);font-size:14px;line-height:1.6}
.sugs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sug{display:grid;gap:3px;text-align:left;padding:11px 12px;border-radius:14px;background:#fff;border:1px solid var(--pl);font-size:13px;line-height:1.45;color:var(--pi);transition:border-color .15s,box-shadow .2s,transform .16s var(--ease-out);animation:msg-in .45s var(--ease-out) both}
.sug:nth-child(2){animation-delay:50ms}.sug:nth-child(3){animation-delay:100ms}.sug:nth-child(4){animation-delay:150ms}
.sug small{color:var(--pm);font-size:11.5px}
@media (hover:hover){ .sug:hover{border-color:rgba(21,33,44,.25);box-shadow:0 4px 14px rgba(21,33,44,.08)} }
.ai-in{margin:0 12px calc(12px + env(safe-area-inset-bottom));padding:8px 8px 8px 12px;border-radius:18px;background:#fff;border:1px solid var(--pl);box-shadow:0 2px 10px rgba(21,33,44,.06);transition:border-color .2s,box-shadow .2s}
.ai-in:focus-within{border-color:rgba(21,33,44,.3);box-shadow:0 4px 18px rgba(21,33,44,.1)}
.ai-ctx:empty{display:none}
.ai-ctx{display:flex;gap:6px;margin:2px 0 4px}
.ai-ctx span{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--pp2);color:var(--pm)}
.ai-in textarea{display:block;width:100%;min-height:24px;max-height:160px;resize:none;border:0;outline:0;padding:4px 0;background:none;color:var(--pi);font-size:15px;line-height:1.55;caret-color:var(--pa)}
.ai-in textarea::placeholder{color:#9AA1A8}
.ai-bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ai-hint{font-size:11px;color:#9AA1A8}
@media (hover:none){ .ai-hint{visibility:hidden} }
.ai-send{position:relative;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--pi);color:var(--pp);transition:transform .16s var(--ease-out),background .2s,opacity .2s}
.ai-send:active{transform:scale(.92)}
.ai-send:disabled{opacity:.35}
.ai-send svg.i{width:16px;height:16px;position:absolute;transition:opacity .2s var(--ease-out),scale .3s var(--spring),filter .2s}
.ai-send .s2{opacity:0;scale:.5;filter:blur(3px)}
.ai.busy .ai-send{background:var(--pa)}
.ai.busy .ai-send .s1{opacity:0;scale:.5;filter:blur(3px)}
.ai.busy .ai-send .s2{opacity:1;scale:1;filter:none;fill:currentColor}
.ai-set{display:grid;gap:14px}
.ai-set h3{margin:0;font-family:var(--display);font-size:18px}
.ai-set .f{grid-template-columns:1fr;gap:10px}
.ai-set .f label{color:var(--pm)}
.ai-set .f input,.ai-set .f select{background:#fff;color:var(--pi);border-color:var(--pl)}
.ai-set .f input:focus,.ai-set .f select:focus{border-color:var(--pi);background:#fff}
.ai-set .f select option{background:#fff}
.ai-set p{margin:0;font-size:12px;line-height:1.65;color:var(--pm)}
.ai-set fieldset{border:1px solid var(--pl);border-radius:12px;padding:10px 12px 12px;margin:0;display:grid;gap:10px}
.ai-set legend{padding:0 6px;font-size:12px;color:var(--pm)}
.ai-set .ck{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--pi)}
.ai-set .chk{border-color:var(--pm)}
.ai-set .row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--pm)}
.ai-set code{font-size:12px;padding:1px 5px;border-radius:5px;background:var(--pp2);color:var(--pi)}
.ai-set .btn.pri{background:var(--pi);color:var(--pp);justify-content:center}
.ai-set .btn.sec{color:var(--pi);border-color:var(--pl)}
.toast{position:fixed;z-index:80;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;padding:10px 16px;border-radius:12px;background:var(--paper);color:var(--ink);font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:opacity .2s,transform .3s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px}
.toast button{padding:4px 10px;border-radius:8px;background:var(--ink);color:var(--paper);font-weight:600;font-size:13px}
.bk-note{margin:0 0 14px;color:var(--snow-2);font-size:13px;line-height:1.6}
.bk-acts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.bk{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.bk li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05)}
.bk b{font-weight:600;font-size:14px}
.bk small{color:var(--snow-3);font-size:12px;grid-column:1}
.bk .r{grid-column:2;grid-row:1/3;display:flex;gap:6px}
.bk .r button{padding:6px 10px;border-radius:8px;border:1px solid var(--rule);font-size:13px;color:var(--snow-2)}
.bk .r button:hover{background:rgba(255,255,255,.08);color:var(--snow)}

/* ---------- bill page ---------- */
#trans{background:linear-gradient(180deg,#06141F 0%,#11293A 100%);scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.tr-wrap{max-width:980px;margin:0 auto;padding:max(64px,calc(env(safe-area-inset-top) + 56px)) 16px 72px}
@media (min-width:900px){ .tr-wrap{padding:48px 48px 80px} }
.tr-head h2{font-family:var(--display);font-size:clamp(44px,9vw,84px);line-height:.95;letter-spacing:-.035em;margin:0}
.tr-head p{color:var(--snow-2);margin:10px 0 0;font-size:14px}
.tr-stats{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.tr-stats span{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--rule);font-size:13px;color:var(--snow-2)}
.tr-stats svg.i{width:15px;height:15px}
.tr-stats .warn{border-color:rgba(242,181,68,.45);color:var(--sun)}
.tr-filter{display:flex;gap:8px;align-items:center;margin:14px 0 18px;font-size:13px;color:var(--snow-3)}
.tr-filter label{display:flex;align-items:center;gap:8px;cursor:pointer}
.tr-list{list-style:none;margin:0;padding:0;position:relative}
.tr-list::before{content:"";position:absolute;left:61px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--rule),var(--rule)) }
.tr-day{position:relative;display:grid;grid-template-columns:54px 16px 1fr;gap:0 12px;padding:10px 0}
.tr-day .dn{text-align:right;font-family:var(--display);font-weight:700;font-size:15px;line-height:1.2}
.tr-day .dn small{display:block;white-space:nowrap;font-weight:500;font-size:11px;color:var(--snow-3);font-family:var(--body)}
.tr-day .node{width:12px;height:12px;margin:4px 0 0 2px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px #0B1A26;z-index:1}
.tr-day.stay .node{width:8px;height:8px;margin:6px 0 0 4px;background:var(--snow-3)}
.tr-body{min-width:0;display:grid;gap:8px}
.tr-route{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.tr-route b{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.01em}
.tr-route .arrow{color:var(--snow-3)}
.tr-route .go{margin-left:auto;font-size:12px;color:var(--snow-3);text-decoration:none;padding:3px 8px;border-radius:8px}
.tr-route .go:hover{background:rgba(255,255,255,.07);color:var(--snow)}
.tr-day.stay .tr-route b{font-size:14px;font-weight:600;color:var(--snow-2)}
.tr-day.stay .tr-route small{color:var(--snow-3);font-size:12px}
.leg{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;padding:11px 14px;border-radius:14px;background:var(--paper);color:var(--p-ink);transition:transform .16s var(--ease-out),box-shadow .2s}
@media (hover:hover){ .leg:hover{box-shadow:0 6px 18px rgba(0,0,0,.3)} }
.leg:active{transform:scale(.985)}
.leg .k{grid-column:1;grid-row:1/3;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--paper-2);color:var(--p-ink)}

/* press feedback: every pressable thing answers the finger */
.ra:active,.chips button:active,.seg a:active,.tabs button:active,.add-ph:active,.open-day:active,.add-tk:active,.ghost:active,.x:active,.res .acts button:active,.pg .acts button:active,.sd-acts button:active,.ai-ico:active,.sug:active{transform:scale(.96)}
.tk:active{transform:scale(.985)}
@media (hover:none){ .ra:hover{transform:none} }
.seg{position:relative;isolation:isolate}
.seg a{position:relative;z-index:1;transition:color .25s var(--ease-out),transform .16s var(--ease-out)}
.seg a[aria-current=page]{background:none}
.seg .ind{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:999px;background:var(--snow);transition:translate .55s var(--spring),width .55s var(--spring)}
.tabs{position:relative}
.tabs .ind{position:absolute;bottom:-1px;left:0;height:2px;width:0;background:var(--sun);border-radius:2px;transition:translate .5s var(--spring),width .5s var(--spring)}
.tabs button[aria-selected=true]{border-color:transparent}
/* list entrance: short stagger, never blocks input */
@keyframes rise{from{opacity:0;transform:translateY(8px);filter:blur(4px)}}
.pl-body.enter>*:not(.hintline),.pl-body.enter .res>li,.pl-body.enter .pg-list>.pg{animation:rise .42s var(--ease-out) both}
.pl-body.enter>*:nth-child(2),.pl-body.enter .res>li:nth-child(2),.pl-body.enter .pg-list>.pg:nth-child(2){animation-delay:40ms}
.pl-body.enter>*:nth-child(3),.pl-body.enter .res>li:nth-child(3),.pl-body.enter .pg-list>.pg:nth-child(3){animation-delay:80ms}
.pl-body.enter>*:nth-child(4),.pl-body.enter .res>li:nth-child(4),.pl-body.enter .pg-list>.pg:nth-child(4){animation-delay:120ms}
.pl-body.enter>*:nth-child(n+5),.pl-body.enter .res>li:nth-child(n+5),.pl-body.enter .pg-list>.pg:nth-child(n+5){animation-delay:160ms}
/* view switches (行程 / 规划 / 账单) */
::view-transition-old(root){animation:vt-out .2s var(--ease-out) both}
::view-transition-new(root){animation:vt-in .42s var(--ease-out) both}
@keyframes vt-out{to{opacity:0;filter:blur(6px);transform:scale(.985)}}
@keyframes vt-in{from{opacity:0;filter:blur(8px);transform:scale(1.012)}}
.city{transition:transform .9s var(--ease-out),opacity .9s var(--ease-out),filter .9s var(--ease-out)}
.screen.idle .city{filter:blur(8px)}
.toast{transition:opacity .2s var(--ease-out),transform .55s var(--spring)!important}
#lb img{transition:transform .5s var(--spring)!important}
.wm-dragging,.wm-dragging *{cursor:grabbing!important;user-select:none}
@media (prefers-reduced-motion:reduce){
  ::view-transition-old(root),::view-transition-new(root){animation:none}
  *,*::before,*::after{transition-duration:.01ms!important;animation:none!important}
  .screen.idle .city,.screen.idle .stops li{transform:none;opacity:1}
  .screen.idle .dl-fill{transform:none}
}

.bl-currency-head{display:grid;grid-template-columns:1fr 1fr 75px;gap:10px;color:var(--bl-muted);font-size:11px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.bl-currency-head span:not(:first-child){text-align:right}
.bl-currency{list-style:none;margin:0;padding:0;display:grid}
.bl-currency li+li{border-top:1px solid rgba(255,255,255,.08)}
.bl-currency button{display:grid;grid-template-columns:1fr 1fr 75px;gap:10px;width:100%;padding:11px 0;text-align:right;align-items:baseline;font-size:16px}
.bl-currency button>span:first-child{text-align:left}.bl-currency b{font:600 14px var(--display)}
.bl-currency small{display:block;font:11px var(--body);color:var(--bl-muted);margin-top:3px}
.bl-currency button>span:last-child{font-size:13px;color:var(--bl-soft)}
.bl-category-budgets{display:grid;gap:15px}.bl-cat-budget{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;text-align:left;font-size:12px}
.bl-cat-budget>span:nth-child(2){text-align:right}.bl-cat-budget small{font-size:11px;color:var(--bl-muted)}
.bl-cat-budget .bl-budget-track{grid-column:1/-1;height:5px}
.bl-text-btn{font-size:12px;color:var(--sun);padding:2px 0}
.bl-top{list-style:none;padding:0;margin:0;display:grid;gap:16px;counter-reset:rank}
.bl-top button{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;width:100%;text-align:left;align-items:start}
.bl-rank{font-size:14px;color:var(--bl-muted)}.bl-top b{font-size:12px;font-weight:500;line-height:1.6;display:block;overflow-wrap:anywhere}
.bl-top small{font-size:11px;color:var(--bl-muted);display:block;margin-top:3px}.bl-top strong{font-size:14px;font-weight:500;padding-top:2px}
.bl-exchange>summary{cursor:pointer;font-weight:600;font-size:14px}.bl-exchange summary small{font-weight:400;font-size:11px;color:var(--bl-muted);margin-left:8px}
.bl-exchange .rates{margin-top:14px}.bl-exchange input{min-height:36px}.bl-exchange .rates label{font-size:12px}
.bl-form-note{grid-column:1/-1;color:var(--snow-2);font-size:12px;margin:0 0 6px;line-height:1.7}
.bl-tooltip{position:fixed;z-index:3000;max-width:min(300px,calc(100vw - 16px));white-space:pre-line;pointer-events:none;background:var(--paper);color:var(--ink);padding:11px 14px;font-size:12px;line-height:1.9;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.28);font-variant-numeric:tabular-nums}
.bl-tooltip[hidden]{display:none}
.bl-scroll-hint{display:none}@media(max-width:899px){.bl-scroll-hint{display:block;font-size:11px;line-height:1.7;color:var(--bl-muted);margin:8px 0 0}}
.bl-range-error{font-size:12px;color:#8F291F;margin:12px 0}
@media (max-width:599px){.bl-search select,.bl-detail-filters select{font-size:16px}.bl-detail-filters{grid-template-columns:1fr 1fr}.bl-detail-filters>label:last-child{grid-column:1/-1}}
@media (hover:hover){.bl-chart-switch button:not([aria-pressed=true]):hover{background:rgba(255,255,255,.08)}.bl-receipt .rc-head .btn:hover{background:var(--paper-2)}.bl-currency button:hover,.bl-top button:hover,.bl-cat-budget:hover{color:var(--sun)}}
@media (min-width:1200px){.bl-metrics{grid-template-columns:repeat(6,minmax(0,1fr));gap:20px}.bl-metrics dd{font-size:30px}.bl-head h2{font-size:38px}}

<div class="app">

    <div class="ra-wrap ra-ai"><button class="ra" data-act="ai-open" aria-label="打开规划助手"><svg class="i"><use href="#i-spark"/></svg></button><span class="ra-l">助手</span></div>
    <div class="ra-wrap"><button class="ra" data-act="plan-day" aria-label="在地图上规划这一天"><svg class="i"><use href="#i-map"/></svg></button><span class="ra-l">地图</span></div>
    <div class="ra-wrap"><button class="ra" data-act="journal" aria-label="写日志"><svg class="i"><use href="#i-pen"/></svg></button><span class="ra-l">日志</span></div>

</div>
<div class="drawer" id="drawer" aria-hidden="true">
  <aside role="dialog" aria-modal="true" aria-labelledby="dr-title" tabindex="-1">

    <div class="dr-body"></div>
    <div class="dr-foot"></div>
  </aside>
</div>
<div id="lb" role="dialog" aria-modal="true" aria-label="查看图片"><p></p></div>
<input type="file" id="photoFile" accept="image/*" multiple hidden>
<div id="ai" class="ai">
  <button type="button" class="ai-cap" aria-expanded="false" aria-controls="ai-panel" title="规划助手（可拖动）"><span class="orb"><svg class="i"><use href="#i-spark"/></svg></span><span class="cap-t">规划助手</span></button>
  <section class="ai-panel" id="ai-panel" role="dialog" aria-label="规划助手">
    <header class="ai-head">
      <button type="button" class="ai-ico" data-ai="threads" aria-label="历史对话" aria-expanded="false"><svg class="i"><use href="#i-hist"/></svg></button>
      <div class="ai-title"><b>规划助手</b><button type="button" class="ai-model" data-ai="settings"></button></div>
      <div class="ai-tools"><button type="button" class="ai-ico" data-ai="new" aria-label="新对话"><svg class="i"><use href="#i-compose"/></svg></button><button type="button" class="ai-ico ai-dockbtn" data-ai="dock" aria-label="停靠到右侧"><svg class="i"><use href="#i-dock"/></svg></button><button type="button" class="ai-ico" data-ai="close" aria-label="收起"><svg class="i"><use href="#i-x"/></svg></button></div>
    </header>
    <div class="ai-main">
      <nav class="ai-threads" aria-label="历史对话"></nav>
      <div class="ai-body"><div class="ai-log" aria-live="polite"></div></div>
    </div>
    <form class="ai-in"><div class="ai-ctx"></div><textarea rows="1" placeholder="想怎么安排？比如：第 3 天下午想找个暖和的地方坐坐" aria-label="给规划助手的消息"></textarea>
      <div class="ai-bar"><span class="ai-hint">Enter 发送 · Shift+Enter 换行</span><button class="ai-send" type="submit" aria-label="发送"><svg class="i s1"><use href="#i-send"/></svg><svg class="i s2"><use href="#i-stop"/></svg></button></div></form>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

_Islands%2C_Norway.jpg/960px-Hamn%C3%B8y%2C_Moskenes%C3%B8ya_-_Lofoten_Islands%2C_Norway.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail","https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b0/Hamn%C3%B8y_Reine_Moskenes_Lofoten_norway_tunliweb_02.jpg/960px-Hamn%C3%B8y_Reine_Moskenes_Lofoten_norway_tunliweb_02.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail"],"lat":67.94639,"lon":13.13762},"萨克里瑟伊黄色渔屋":{"intro":"Sakrisøy 以一排芥末黄色的渔屋闻名，就在雷讷和哈姆讷伊之间。","photos":[],"lat":67.94121,"lon":13.11109},"奥镇（Å）鳕鱼干架":{"intro":"E10 公路的终点，保留着完整的老渔村和鳕鱼干博物馆；冬季能看到挂满鳕鱼的木架。","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2f/A_view_2009.JPG/960px-A_view_2009.JPG?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail","https://thumb.wikimedia.org/wikipedia/commons/thumb/4/42/%C3%85_i_Lofoten.jpg/960px-%C3%85_i_Lofoten.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail"],"lat":67.87962,"lon":12.98404},"努斯夫约德古渔村":{"intro":"挪威保存最完整的渔村之一，木屋、码头和老商店都保留着原貌，入村需付少量费用。","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/Nusfjord.jpg/960px-Nusfjord.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail","https://thumb.wikimedia.org/wikipedia/commons/thumb/9/90/Nusfjord_le_port.jpg/960px-Nusfjord_le_port.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail","https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/Nusfjord.jpg/1280px-Nusfjord.jpg"],"lat":68.03541,"lon":13.3477},"豪克兰海滩":{"intro":"被群山环绕的白沙海滩，海水是罕见的碧绿色，冬天常常只有你一个人。","photos":[],"lat":68.192,"lon":13.53891},"亨宁斯韦尔岛上足球场":{"intro":"建在几座小岛上的渔村，被称为“罗弗敦的威尼斯”，岛尖的足球场因航拍照片出名。","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/Henningsv%C3%A6r_marina_buildings.jpg/960px-Henningsv%C3%A6r_marina_buildings.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail","https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a8/V%C3%A5gan_Festv%C3%A5gtinden_lub_2025-07-20_img05_Aussicht.jpg/960px-V%C3%A5gan_Festv%C3%A5gtinden_lub_2025-07-20_img05_Aussicht.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail","https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c1/Henningsv%C3%A6r_and_the_surrounding_islands.jpg/960px-Henningsv%C3%A6r_and_the_surrounding_islands.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail"],"lat":68.14799,"lon":14.20073},"入住斯沃尔韦尔":{"intro":"罗弗敦最大的镇子和交通枢纽，港口背后是陡峭的 Svolværgeita 双峰。","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/4/42/Svolvaer%2C_Lofoten%2C_Norway.JPG/960px-Svolvaer%2C_Lofoten%2C_Norway.JPG?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail","https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/Svolvaer_with_Hotel_Lofoten%2C_Lofoten%2C_Norway.jpg/960px-Svolvaer_with_Hotel_Lofoten%2C_Lofoten%2C_Norway.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail","https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/Svolv%C3%A6r_kirke.JPG/960px-Svolv%C3%A6r_kirke.JPG?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail"],"lat":68.23217,"lon":14.5646},"还车，前往机场":{"intro":"斯沃尔韦尔 Helle 机场很小，还车后步行即可进航站楼。","photos":[],"lat":68.2417,"lon":14.66708},"抵达特罗姆瑟入住":{"intro":"北纬 69° 的北极城市，被称为“北极之门”。12 月处于极夜，正午也只有几小时蓝调天光。","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b0/Troms%C3%B8_sentrum_%285835702754%29.jpg/960px-Troms%C3%B8_sentrum_%285835702754%29.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail","https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3f/Tromso_burial.JPG/960px-Tromso_burial.JPG?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail","https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/Skansen_-_a_medieval_fortress_at_least_750_years_old._The_fortification_was_strategically_located_on_a_point_with_a_view_of_the_shipping_lane_to_the_north_and_south.jpg/960px-thumbnail.jpg?utm_source=en.wikipedia.org&utm_ function daysBetween(a, b){
  const out = []; const d = parseD(a), e = parseD(b);
  for (let g = 0; d <= e && g < 90; g++){ out.push(ymd(d)); d.setDate(d.getDate()+1); }
  return out;
}
function load(){
  try {
    const raw = localStorage.getItem(KEY), t = JSON.parse(raw);
    if (t && t.start && t.days && !(t.sample && t.sampleVer !== SAMPLE_VER)) return t;
    if (t && t.start) snapshot('示例数据升级前', true, raw);
  } catch {}
  return null;
}

// Big changes (dates moved, several stops or tickets gone at once) get a labeled backup here and on the computer,
// plus an undo toast — whatever caused them: a form, the assistant, a sync, a restore.
let baseJSON = null;
function impact(a, b){
  try {
    const A = JSON.parse(a), B = JSON.parse(b), stops = t => Object.entries(t.days).filter(([k]) => k >= t.start && k <= t.end).reduce((n, [, d]) => n + d.stops.length, 0);
    const out = [];
    if (A.start !== B.start || A.end !== B.end) out.push(`日期 ${md(A.start)}–${md(A.end)} → ${md(B.start)}–${md(B.end)}`);
    const ds = stops(A) - stops(B); if (ds >= 3) out.push(`少了 ${ds} 项安排`);
    const dt = A.tickets.length - B.tickets.length; if (dt >= 2) out.push(`少了 ${dt} 张票`);
    return out.join('，');
  } catch { return ''; }
}
function save(){
  const json = JSON.stringify(T);
  const big = baseJSON && baseJSON !== json ? impact(baseJSON, json) : '';
  if (big){ snapshot(`大改动前（${big}）`, true, baseJSON); undoJSON = baseJSON; SYNC.label?.(`大改动前：${big}`); setTimeout(() => offerUndo(`${big}。已自动备份`), 0); }
  baseJSON = json;
  try { localStorage.setItem(KEY, json); } catch { toast('浏览器无法保存，请及时导出备份'); }
  snapshot('自动备份'); try { SYNC.push(); } catch {}
}

/* ---------- backups: rolling snapshots + undo ---------- */
const BK = KEY + ':backups';
const BK_MAX = 40, BK_GAP = 10 * 60e3;
function backups(){ try { return JSON.parse(localStorage.getItem(BK)) || []; } catch { return []; } }
function writeBackups(list){
  for (;;){ try { localStorage.setItem(BK, JSON.stringify(list)); return true; } catch { if (list.length <= 1) return false; list.pop(); } }
}
function snapshot(label, force, json = JSON.stringify(T)){
  const list = backups(), last = list[0], now = Date.now();
  if (last && last.json === json) return;
  if (!force && last && now - last.at < BK_GAP) return;
  list.unshift({at:now, label, json});
  while (list.length > BK_MAX) list.pop();
  writeBackups(list);
}
function summary(json){
  try { const t = JSON.parse(json); const n = Object.values(t.days || {}).reduce((s,d) => s + (d.stops || []).length, 0);
    return `${t.name || '未命名'} · ${md(t.start)}–${md(t.end)} · ${n} 项安排 · ${(t.tickets || []).length} 张票`; } catch { return '无法读取'; }
}
const validTrip = t => t && /^\d{4}-\d{2}-\d{2}$/.test(t.start) && /^\d{4}-\d{2}-\d{2}$/.test(t.end) && typeof t.days === 'object';
function adopt(t){
  T = Object.assign({people:['我'], rates:{CNY:1}, tickets:[], expenses:[], packing:[], pilgrims:[]}, t);
  enrich(T);
  T.tickets = T.tickets.filter(k => KIND[k.kind]);
}
let undoJSON = null;
function checkpoint(){ undoJSON = JSON.stringify(T); snapshot('删除前', true, undoJSON); }
function offerUndo(msg){
  toast(msg, '撤销', () => { if (!undoJSON) return; adopt(JSON.parse(undoJSON)); undoJSON = null; commit(); toast('已撤销'); });
}

/* ---------- photos: remote links or IndexedDB blobs ("idb:<id>") ---------- */
const idb = (() => {
  let p;
  const open = () => p ||= new Promise((res, rej) => { const r = indexedDB.open('nordic-trip-photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction('p', mode); const q = fn(t.objectStore('p')); t.oncomplete = () => res(q?.result); t.onerror = () => rej(t.error); }));
  return {get: k => tx('readonly', st => st.get(k)), put: (k, v) => tx('readwrite', st => st.put(v, k))};
})();
const blobURLs = new Map();
function hydrate(root = document){
  $$('img[data-idb]', root).forEach(async img => {
    const k = img.dataset.idb; let u = blobURLs.get(k);
    if (!u){ try { const b = await idb.get(k); if (!b) throw 0; u = URL.createObjectURL(b); blobURLs.set(k, u); } catch { img.closest('.ph')?.classList.add('missing'); return; } }
    img.src = u;
  });
}
async function compress(file){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(), 'image/jpeg', .82));
}

}

function bindReorder(root){

/* hotel finder: anchors (chosen stops) + nightly budget → nearby hotels from OpenStreetMap, ranked by walking time and price tier */
const hotel = {city:'', anchors:new Set(), budget:1500, results:[], busy:false, msg:''};
const planRefresh = () => document.body.dataset.view === 'plan' && renderPlan(true);
const cityStops = c => dates().filter(d => day(d).city === c).flatMap(d => day(d).stops.filter(s => s.lat != null).map(s => ({s, d})));

const isFar = (s, ss) => km(medOf(ss), s) > 10;
function hotelDefaults(city){
  hotel.city = city; hotel.results = []; hotel.msg = '';

function tierOf(h){
  if (/hostel/.test(h.type)) return {t:1, label:'青旅', range:'约 ¥300–800'};
  if (/guest_house|apartment|motel|chalet/.test(h.type)) return {t:2, label:h.type === 'apartment' ? '公寓' : '民宿 / 小旅馆', range:'约 ¥700–1400'};
  const st = parseFloat(h.stars);
  if (st >= 5) return {t:4, label:'5 星酒店', range:'约 ¥2800 起'};
  if (st >= 4) return {t:3, label:'4 星酒店', range:'约 ¥1500–2600'};
  if (st >= 3) return {t:2, label:'3 星酒店', range:'约 ¥1000–1600'};
  if (st) return {t:1, label:`${st} 星酒店`, range:'约 ¥600–1100'};

  const near = picked.filter(s => !isFar(s, picked)), A = near.length ? near : picked;
  hotel.farOnes = picked.filter(s => !A.includes(s)).map(s => `${s.title}（约 ${Math.round(km(medOf(A), s))} km）`);
  hotel.busy = true; hotel.results = []; hotel.msg = ''; planRefresh();
  const c = {lat: A.reduce((s, a) => s + a.lat, 0) / A.length, lon: A.reduce((s, a) => s + a.lon, 0) / A.length};
  const spread = Math.max(...A.map(a => km(c, a)));
  const R = Math.min(8, Math.max(1.2, spread + 1)), dLat = R / 111, dLon = R / (111 * Math.cos(c.lat * Math.PI / 180));

  try {
    for (const q of ['hotel', 'hostel', 'guest house']){
      const wait = 1100 - (Date.now() - lastSearchAt); if (wait > 0) await new Promise(r => setTimeout(r, wait)); lastSearchAt = Date.now();
      const r = await fetch('https://nominatim.openstreetmap.org/search?' + new URLSearchParams({q, format:'jsonv2', viewbox:vb, bounded:'1', limit:'40', extratags:'1', namedetails:'1', 'accept-language':'zh-CN,zh,en'}));

function guessCat(r){

    try { const ll = await wapi(lang, {action:'query', prop:'langlinks', titles:page, lllang:'zh'}); const z = ll.query?.pages?.[0]?.langlinks?.[0]?.title; if (z) return {lang:'zh', page:z}; } catch {}

async function mcpRpc(method, params, notify){
  netCfg.url ||= defaultNetUrl();

  const id = notify ? undefined : ++mcp.id;
  const r = await fetch(netCfg.url, {method:'POST', headers:h, body:JSON.stringify({jsonrpc:'2.0', method, ...(params ? {params} : {}), ...(notify ? {} : {id})})});
  const sid = r.headers.get('mcp-session-id'); if (sid) mcp.sid = sid;
  if (notify) return null;
  if (r.status === 404 && h['mcp-session-id']){ mcp.ok = false; mcp.sid = null; throw new Error('session-expired'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);

    ? txt.split('\n').filter(l => l.startsWith('data:')).map(l => JSON.parse(l.slice(5)))
    : [JSON.parse(txt)];
  const m = msgs.find(x => x.id === id) || msgs.at(-1);
  if (m?.error) throw new Error(m.error.message);
  return m?.result;
}
