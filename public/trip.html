function mdInline(s){
  return s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s（(：:，。])(https?:\/\/[^\s<）)，。]+)/g, (m, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\/(www\.)?/, '').slice(0, 36)}${u.length > 44 ? '…' : ''}</a>`);
}
function mdRender(src){
  const lines = esc(src).split('\n'), out = []; let list = null, para = [], code = null;
  const flushP = () => { if (para.length){ out.push(`<p>${mdInline(para.join('<br>'))}</p>`); para = []; } };
  const flushL = () => { if (list){ out.push(`<${list.t}>${list.items.map(x => `<li>${mdInline(x)}</li>`).join('')}</${list.t}>`); list = null; } };
  for (let i = 0; i < lines.length; i++){
    const l = lines[i];
    if (code){ if (/^```/.test(l)){ out.push(`<pre><code>${code.join('\n')}</code></pre>`); code = null; } else code.push(l); continue; }
    if (/^```/.test(l)){ flushP(); flushL(); code = []; continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')){
      flushP(); flushL(); const row = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => mdInline(c.trim()));
      const head = row(l); i += 1; const body = [];
      while (i + 1 < lines.length && /^\s*\|.*\|\s*$/.test(lines[i + 1])) body.push(row(lines[++i]));
      out.push(`<table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`); continue;
    }
    const h = l.match(/^#{1,4}\s+(.*)/); if (h){ flushP(); flushL(); out.push(`<h4>${mdInline(h[1])}</h4>`); continue; }
    const ul = l.match(/^\s*[-*•]\s+(.*)/), ol = l.match(/^\s*\d+[.)、]\s+(.*)/);
    if (ul || ol){ flushP(); const tt = ul ? 'ul' : 'ol'; if (!list || list.t !== tt){ flushL(); list = {t:tt, items:[]}; } list.items.push((ul || ol)[1]); continue; }
    if (!l.trim()){ flushP(); flushL(); continue; }
    if (list && /^\s{2,}\S/.test(l)){ list.items[list.items.length - 1] += '<br>' + l.trim(); continue; }
    flushL(); para.push(l);
  }
  if (code) out.push(`<pre><code>${code.join('\n')}</code></pre>`);
  flushP(); flushL(); return out.join('');
}

function settle(list){
  // "一起" (paid from the shared pot) never creates a debt; only personally advanced money is split.
  const paid = Object.fromEntries(T.people.map(p => [p, 0]));
  const own = list.filter(e => e.payer !== '一起');
  own.forEach(e => { if (!(e.payer in paid)) paid[e.payer] = 0; paid[e.payer] += e.cny; });
  const total = own.reduce((s,e) => s + e.cny, 0), share = total / T.people.length;
  const bal = Object.entries(paid).map(([p,v]) => [p, v - (T.people.includes(p) ? share : 0)]);
  const debt = bal.filter(b => b[1] < -0.5).map(b => [b[0], -b[1]]), cred = bal.filter(b => b[1] > 0.5);

let billTooltip;
function hideBillTip(){ if (billTooltip) billTooltip.hidden=true; }
function showBillTip(target,event){
  if (!target?.dataset.btip) return hideBillTip();
  if (!billTooltip){ billTooltip=document.createElement('div'); billTooltip.id='bill-tooltip'; billTooltip.className='bl-tooltip'; billTooltip.role='tooltip'; document.body.append(billTooltip); }
  billTooltip.textContent=target.dataset.btip; billTooltip.hidden=false;
  const r=target.getBoundingClientRect(), x=event?.clientX??r.left+r.width/2, y=event?.clientY??r.top;
  const w=billTooltip.offsetWidth,h=billTooltip.offsetHeight;
  billTooltip.style.left=Math.max(8,Math.min(innerWidth-w-8,x+14))+'px';
  billTooltip.style.top=Math.max(8,Math.min(innerHeight-h-8,y-h-12))+'px';
}

    const value=Number(t.value); if(!Number.isFinite(value)||value<=0){t.setCustomValidity('请填写大于 0 的有效汇率');t.reportValidity();return;}

/* ---------- actions ---------- */
function flipCapture(){
  const m = new Map();
  $$('.stops li[data-id], .meals li[data-id], #plan .res > li').forEach(el => { const r = el.getBoundingClientRect(); if (r.height) m.set((el.dataset.id || '') + '|' + (el.closest('#drawer') ? 'd' : el.closest('#plan') ? 'p' : 'f'), r); });
  return m;
}
function flipPlay(before){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  $$('.stops li[data-id], .meals li[data-id]').forEach(el => {
    const r = el.getBoundingClientRect(); if (!r.height || r.bottom < 0 || r.top > innerHeight) return;
    const b = before.get(el.dataset.id + '|' + (el.closest('#drawer') ? 'd' : el.closest('#plan') ? 'p' : 'f'));
    if (!b) return void el.animate([{opacity:0, transform:'translateY(6px)', filter:'blur(4px)'}, {opacity:1, transform:'none', filter:'none'}], {duration:320, easing:'cubic-bezier(.23,1,.32,1)'});
    const dx = b.left - r.left, dy = b.top - r.top;
    if (Math.abs(dx) + Math.abs(dy) > 1) el.animate([{transform:`translate(${dx}px,${dy}px)`}, {transform:'none'}], {duration:420, easing:'cubic-bezier(.23,1,.32,1)'});
  });
}
function commit(){ const flip = flipCapture(); commitInner(); requestAnimationFrame(() => flipPlay(flip)); }
function commitInner(){ save(); const k = current; renderIndex(); renderFeed(); if (document.body.dataset.view === 'bill') renderBill(); if (document.body.dataset.view === 'trans') renderTrans(); if (document.body.dataset.view === 'plan') renderPlan(true); go(k, false); refreshOpenDay && dr.classList.contains('open') && $('.dr-body .stops, .dr-body .empty', dr) && refreshOpenDay(); }
document.addEventListener('click', e => {
  const pd = e.target.closest('[data-pday]'); if (pd){ planDay = pd.dataset.pday; if (planTab === 'search' && !searchRes.length) planTab = 'stops'; renderPlan(); return; }
  const pt = e.target.closest('[data-ptab]'); if (pt){ planTab = pt.dataset.ptab; renderPlan(); return; }
  const pk = e.target.closest('[data-pkind]'); if (pk){ pgKind = pk.dataset.pkind; renderPlan(true); return; }
  const g = e.target.closest('[data-go]'); if (g){ if (document.body.dataset.view !== 'trip') location.hash = '#trip'; go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]'); if (!a || a.matches('input')) return;
  const d = a.dataset.date || curDate();
  switch (a.dataset.act){
    case 'add-stop': editStop(d); break;
    case 'edit-stop': editStop(d, a.dataset.id); break;
    case 'add-meal': editMeal(d); break;
    case 'edit-meal': editMeal(d, a.dataset.id); break;
    case 'toggle-detail': { const id = a.dataset.id, open = !openStops.has(id); open ? openStops.add(id) : openStops.delete(id);
      $$(`li[data-id="${id}"]`).forEach(li => { li.classList.toggle('open', open); $('.st', li)?.setAttribute('aria-expanded', String(open)); });
      if (open && document.body.dataset.view === 'plan' && markers.has(id)) focusOn(id, false); break; }
    case 'add-photo': addPhoto(a.dataset.id); break;
    case 'view-photo': { const [s] = findAny(a.dataset.id); const img = $('img', a); if (s && img?.src) lightbox(img.src, s.title || s.name); break; }
    // shortcut: removed idb blobs stay in IndexedDB (undo/backups may still reference them)
    case 'rm-photo': { const [s] = findAny(a.dataset.id); if (s){ checkpoint(); s.photos.splice(+a.dataset.i, 1); commit(); offerUndo('已移除图片'); } break; }
    case 'add-ticket': editTicket(null, d); break;
    case 'edit-ticket': editTicket(a.dataset.id); break;
    case 'edit-day': editDay(d); break;
    case 'journal': editJournal(d); break;
    case 'packing': packing(); break;
    case 'open-day': openDay(d); break;
    case 'edit-trip': editTrip(); break;
    case 'add-expense': editExpense(); break;
    case 'edit-entry': a.dataset.src === 'meal' ? editMeal(a.dataset.date, a.dataset.id) : a.dataset.src === 'exp' ? editExpense(a.dataset.id) : a.dataset.src === 'ticket' ? editTicket(a.dataset.id) : editStop(a.dataset.date, a.dataset.id); break;
    case 'form-del': delHandler?.(); break;
    case 'export': exportJSON(); break;
    case 'import': $('#importFile').click(); break;
    case 'backup': backupDrawer(); break;
    case 'plan-day': gotoPlan(curDate()); break;
    case 'ai-open': openAI(true); break;
    case 'map-focus': { const id = a.dataset.id; if (document.body.dataset.view === 'plan') { planDay = dayOf(id) || planDay; renderPlan(true); focusOn(id); } else gotoPlan(dayOf(id), id); break; }
    case 'plan-open': { const id = a.dataset.id; map?.closePopup(); planDay = dayOf(id); planTab = 'stops'; openStops.add(id); hotId = id; renderPlan(true); setTimeout(() => $(`#plan li[data-id="${id}"]`)?.scrollIntoView({block:'center', behavior:'smooth'}), 60); break; }
    case 'locate': { const id = a.dataset.id, [s, sd] = findStop(id); if (!s) break; locating = id;
      const q = `${s.title.replace(/[·（(].*$/, '').trim()} ${day(sd).city}`;
      if (document.body.dataset.view !== 'plan'){ planDay = sd; location.hash = '#plan'; }
      setTimeout(() => { const inp = $('#plan .srch input'); if (inp) inp.value = q; search(q); }, 150); break; }
    case 'set-loc': { const r = searchRes[+a.dataset.ri], [s] = findStop(locating); if (r && s){ s.lat = r.lat; s.lon = r.lon; const id = locating; locating = null; searchRes = []; planTab = 'stops'; hotId = id; commit(); toast('位置已设置'); setTimeout(() => focusOn(id, false), 200); } break; }
    case 'wiki': wiki(a.dataset.id); break;
    case 'add-res': addFromResult(+a.dataset.ri, a.closest('li').querySelector('[data-day]').value); break;
    case 'res-focus': hotId = 'r' + a.dataset.ri; focusOn('r' + a.dataset.ri, false); $$('#plan .res li').forEach(li => li.classList.toggle('hot', li.dataset.ri === a.dataset.ri)); break;
    case 'res-pilgrim': savePilgrim(+a.dataset.ri); break;
    case 'pg-add': pgAdd(a.dataset.pid, a.dataset.day || a.closest('.pg')?.querySelector('[data-day]')?.value || dates()[0]); map?.closePopup(); break;
    case 'pg-focus': hotId = a.dataset.pid; focusOn(a.dataset.pid); break;
    case 'pg-del': { checkpoint(); T.pilgrims = T.pilgrims.filter(p => p.id !== a.dataset.pid); commit(); offerUndo('已删除巡礼点'); break; }
    case 'hotel-find': findHotels(); break;
    case 'hotel-pick': pickHotel(+a.dataset.i); map?.closePopup(); break;
    case 'hotel-focus': hotId = 'h' + a.dataset.i; focusOn('h' + a.dataset.i, false); $$('#plan .res li').forEach((li, k) => li.classList.toggle('hot', k === +a.dataset.i)); break;
    case 'basemap': { const ks = Object.keys(BASEMAPS); setBasemap(ks[(ks.indexOf(basemap) + 1) % ks.length]); break; }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.anc){ t.checked ? hotel.anchors.add(t.dataset.anc) : hotel.anchors.delete(t.dataset.anc); hotel.results = []; renderPlan(true); return; }
  if ('hcity' in t.dataset){ hotelDefaults(t.value); renderPlan(); return; }
  if ('hbudget' in t.dataset){ hotel.budget = Math.max(0, +t.value || 0); if (hotel.results.length){ const bt = budgetTier(hotel.budget); hotel.results.forEach(h => h.score = h.avg + .35 * h.far + (h.tier.t ? Math.abs(h.tier.t - bt) : .6) * 14); hotel.results.sort((a, b) => a.score - b.score); } renderPlan(true); return; }
  if (e.target.dataset.act !== 'toggle-stop') return;
  const s = day(e.target.dataset.date).stops.find(x => x.id === e.target.dataset.id);
  if (s){ s.done = e.target.checked; save(); e.target.closest('li').classList.toggle('done', s.done); }
});
function download(json, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(JSON.parse(json), null, 2)], {type:'application/json'}));
  a.download = `${name.replace(/[\\/:*?"<>|\s]+/g, '-')}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportJSON(){
  download(JSON.stringify(T), T.name);
  try { localStorage.setItem(KEY + ':exported', String(Date.now())); } catch {}
  toast('已下载备份文件，发给旅伴导入即可同步');
}
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const t = JSON.parse(await file.text());
    if (!validTrip(t)) throw 0;
    if (!confirm(`导入「${t.name || '未命名旅程'}」会替换当前内容。\n当前内容会先自动备份，可在「备份与恢复」里找回。确定吗？`)) return;
    snapshot('导入前', true); adopt(t);
    commit(); go('cover', false); toast('导入成功');
  } catch { toast('这个文件不是有效的旅程备份'); }
});
let tt; function toast(m, label, fn){
  const el = $('#toast'); el.textContent = m; el.classList.toggle('act', !!fn);
  if (fn){ const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = () => { el.classList.remove('show'); fn(); }; el.append(b); }
  el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), fn ? 6000 : 2200);
}

function route(){
  const v = ({'#bill':'bill', '#plan':'plan', '#trans':'trans'})[location.hash] || 'trip';
  const change = document.body.dataset.view !== v;
  if (change && document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches && !route.busy){
    route.busy = true;
    document.startViewTransition(() => applyRoute(v)).finished.finally(() => { route.busy = false; syncInds(); WM.refresh(); });
  } else applyRoute(v);
}
function applyRoute(v){
  document.body.dataset.view = v;
  renderIndex();
  if (v !== 'trip') SKYFX.detach(); else setTimeout(() => SKYFX.attach(document.getElementById('s-' + current)), 60);
  if (v === 'bill'){ renderBill(); $('#bill').scrollTop = 0; }
  else if (v === 'trans'){ renderTrans(); $('#trans').scrollTop = 0; }
  else if (v === 'plan') renderPlan();
  else go(current, false);
  requestAnimationFrame(() => { syncInds(); WM.refresh(); });
}
addEventListener('hashchange', route);

/* ---------- LAN sync: when served by serve_lan.py, the computer keeps one shared copy ---------- */
const SYNC = (() => {
  const key = TRIP_ID || null;
  const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(KEY + k); localStorage.setItem(KEY + k, v); } catch {} };
  const hash = str => { let h = 2166136261; for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619); return (h >>> 0).toString(36) + str.length; };
  let ver = +(ls(':syncver') || 0), syncedHash = ls(':synchash') || '', timer = 0, inflight = false, live = false, pending = null, conflictSt = null, label = '', status = '';
  const H = {'X-Trip-Key': key || '', 'content-type': 'application/json'};
  const setVer = v => { ver = v; ls(':syncver', String(v)); };
  const markSynced = json => { syncedHash = hash(json); ls(':synchash', syncedHash); };
  const dirty = () => hash(JSON.stringify(T)) !== syncedHash; // edits this device has not handed to the computer yet (survives reloads)
  const pill = document.createElement('button'); pill.type = 'button'; pill.id = 'syncpill'; pill.hidden = true; document.body.append(pill);
  function setStatus(st){
    status = st;
    const text = {offline:'离线 · 改动已保存在这台设备，联网后自动上传到小蜗', pending:'正在保存到小蜗…', conflict:'两台设备都改过 · 点这里选择保留哪份'}[st];
    pill.hidden = !text; pill.className = st; pill.textContent = text || '';
  }
  pill.addEventListener('click', () => { if (status === 'conflict') resolve(); else poll(); });
  function apply(st, msg){
    // Never swap data under an open editor: its form holds references to the old objects.
    if (dr.classList.contains('open') || aiBusy){ pending = [st, msg]; return; }
    snapshot('同步前', true);
    adopt(st.data); const json = JSON.stringify(T); markSynced(json); baseJSON = json; setVer(st.version);
    try { localStorage.setItem(KEY, json); } catch {}
    const k = current; renderIndex(); renderFeed(); if (document.body.dataset.view === 'bill') renderBill(); if (document.body.dataset.view === 'trans') renderTrans(); if (document.body.dataset.view === 'plan') renderPlan(true); go(k, false);
    setStatus('');
    if (msg) toast(msg);
  }
  const brief = d => { const n = Object.entries(d.days || {}).filter(([k]) => k >= d.start && k <= d.end).reduce((s, [, x]) => s + (x.stops || []).length, 0); return `${md(d.start)}–${md(d.end)} · ${n} 项安排 · ${(d.tickets || []).length} 张票`; };
  // Both sides changed: never pick silently. The losing side stays in backups / the computer's history.
  function conflict(st){ conflictSt = st; setStatus('conflict'); if (!dr.classList.contains('open')) resolve(); }
  function resolve(){
    const st = conflictSt; if (!st) return;
    const at = st.at ? new Date(st.at * 1000) : null;
    openDrawer('两台设备都改过行程', `<p class="bk-note">这台设备有还没上传的修改，同时另一台设备也往电脑上保存了新版本。选一份保留；另一份不会丢：电脑上的版本留在「电脑上的历史版本」里，这台设备的版本留在本机备份里。</p>
      <div class="cf"><div><b>电脑上的版本 ${st.version}</b><small>${at ? stamp(at) + ' 保存' : ''}</small><p>${esc(brief(st.data))}</p></div>
      <div><b>这台设备上的</b><small>未上传</small><p>${esc(brief(T))}</p></div></div>`,
      `<div class="r"><button class="btn sec" type="button" data-cf="mine">保留这台设备的</button><button class="btn pri" type="button" data-cf="theirs">用电脑上的</button></div>`);
  }
  dr.addEventListener('click', e => {
    const b = e.target.closest('[data-cf]'); if (!b || !conflictSt) return;
    const st = conflictSt; conflictSt = null; closeDrawer();
    if (b.dataset.cf === 'theirs'){ snapshot('冲突时这台设备的版本', true); apply(st, '已换成电脑上的版本；这台设备的版本在「备份与恢复」里'); }
    else { setVer(st.version); label = `冲突时覆盖了版本 ${st.version}`; setStatus('pending'); send(); toast('已保留这台设备的版本；电脑上原来那版在历史版本里'); }
  });
  async function send(){
    const json = JSON.stringify(T);
    if (!live || inflight || pending || conflictSt || !dirty()) { if (live && !dirty() && status === 'pending') setStatus(''); return; }
    inflight = true; setStatus('pending');
    try {
      const r = await fetch('/api/trip', {method:'PUT', headers:H, body:JSON.stringify({base:ver, data:T, label})});
      if (r.status === 409){ const st = await r.json(); if (JSON.stringify(st.data) === json){ setVer(st.version); markSynced(json); setStatus(''); } else conflict(st); }
      else if (r.ok){ setVer((await r.json()).version); markSynced(json); label = ''; setStatus(dirty() ? 'pending' : ''); }
      else setStatus('offline');
    } catch { setStatus('offline'); }
    inflight = false;
    if (!pending && !conflictSt && status !== 'offline' && dirty()) push();
  }
  function push(){ if (!live) return; clearTimeout(timer); timer = setTimeout(send, 600); }
  async function poll(){
    if (!live || document.hidden || inflight || conflictSt) return;
    if (pending && !dr.classList.contains('open') && !aiBusy){ const [st, msg] = pending; pending = null; dirty() ? conflict(st) : apply(st, msg); return; } // edits made while it waited are never overwritten
    try {
      const v = (await (await fetch('/api/version', {headers:H, cache:'no-store'})).json()).version;
      if (status === 'offline') setStatus(dirty() ? 'pending' : '');
      if (v > ver){
        const st = await (await fetch('/api/trip', {headers:H, cache:'no-store'})).json();
        if (!dirty()) apply(st, '已同步另一台设备的修改'); else conflict(st);
      } else if (dirty()) send(); // offline edits go up as soon as the computer is reachable again
    } catch { setStatus('offline'); }
  }
  async function start(){
    if (!key) return;
    try {
      const r = await fetch('/api/trip', {headers:H, cache:'no-store'});
      if (r.status === 403){ location.replace('/trips.html'); return; }
      if (!r.ok) throw 0;
      const st = await r.json(); live = true;
      if (!syncedHash && !st.data) markSynced('');               // brand-new computer copy: this device uploads below
      if (st.data && (T.sample || !syncedHash)) apply(st); // a fresh device never overwrites the computer
      else if (st.data && st.version !== ver){ if (dirty()) conflict(st); else apply(st); }
      else { setVer(st.version); !st.data && toast('正在上传这份计划'); send(); }
      setInterval(poll, 4000); dispatchEvent(new Event('sync-live'));
      document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
      addEventListener('online', poll);
    } catch { setStatus('offline'); setTimeout(start, 8000); }
  }
  const kvGet = name => fetch('/api/kv/' + name, {headers:H, cache:'no-store'}).then(r => r.ok ? r.json() : null).then(j => j?.data ?? null);
  const kvPut = (name, data) => live ? fetch('/api/kv/' + name, {method:'PUT', headers:H, body:JSON.stringify({data})}).catch(() => {}) : Promise.resolve();
  const versions = () => fetch('/api/history', {headers:H, cache:'no-store'}).then(r => r.ok ? r.json() : {history:[]}).then(j => j.history);
  const version = v => fetch('/api/history/' + v, {headers:H, cache:'no-store'}).then(r => r.ok ? r.json() : null);
  return {push, start, key, kvGet, kvPut, history: versions, version, pull: poll, label: l => { label = l; }, get live(){ return live; }};
})();
renderFeed(); bindReorder(document);
new MutationObserver(() => bindReorder($('#feed'))).observe($('#feed'), {childList:true});
route();
SYNC.start();
// Jump to today when travelling.
const td = ymd(new Date()); if (td >= T.start && td <= T.end) go(td, false);
})();
